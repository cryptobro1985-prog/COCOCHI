<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050308">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>COCOCHI</title>
<link rel="stylesheet" href="/static/v2.css?v=6">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main class="app" id="app">
<section class="art-screen active" id="homeScreen" aria-label="Главная COCOCHI">
<img src="/static/cocochi-home.webp?v=6" alt="COCOCHI — главная, курица Люся" class="art">
<div class="shine"></div>
<button class="hotspot close" data-action="close" aria-label="Закрыть"></button>
<button class="hotspot ton" data-action="wallet" aria-label="TON кошелёк"></button>
<button class="hotspot ton-plus" data-action="wallet" aria-label="Пополнить TON"></button>
<button class="hotspot eggs-plus" data-action="buy" aria-label="Купить яйца"></button>
<button class="hotspot reward" data-action="reward" aria-label="Награды"></button>
<button class="hotspot tasks" data-action="tasks" aria-label="Задания"></button>
<button class="hotspot events" data-action="events" aria-label="События"></button>
<button class="hotspot friends-side" data-action="friends" aria-label="Друзья"></button>
<button class="hotspot collect" data-action="collect" aria-label="Собрать яйца"></button>
<button class="hotspot feed" data-action="feed" aria-label="Кормить"></button>
<button class="hotspot water" data-action="water" aria-label="Поить"></button>
<button class="hotspot clean" data-action="clean" aria-label="Чистить"></button>
<button class="hotspot clothes" data-action="clothes" aria-label="Одежда"></button>
<button class="hotspot upgrade" data-screen="market" aria-label="Улучшение"></button>
<button class="hotspot nav-home" data-screen="home" aria-label="Главная"></button>
<button class="hotspot nav-market" data-screen="market" aria-label="Рынок"></button>
<button class="hotspot nav-coop" data-action="coop" aria-label="Курятник"></button>
<button class="hotspot nav-friends" data-action="friends" aria-label="Друзья"></button>
<button class="hotspot nav-profile" data-action="profile" aria-label="Профиль"></button>
</section>

<section class="art-screen" id="marketScreen" aria-label="Рынок COCOCHI">
<img src="/static/cocochi-market.webp?v=6" alt="COCOCHI — рынок яиц" class="art">
<div class="shine"></div>
<button class="hotspot close" data-action="close" aria-label="Закрыть"></button>
<button class="hotspot market-card" data-action="marketInfo" aria-label="Рынок яиц"></button>
<button class="hotspot sell-big" data-action="sell" aria-label="Продать яйца"></button>
<button class="hotspot buy-big" data-action="buy" aria-label="Купить яйца"></button>
<button class="hotspot care-feed" data-action="feed" aria-label="Корм"></button>
<button class="hotspot care-water" data-action="water" aria-label="Вода"></button>
<button class="hotspot care-clean" data-action="clean" aria-label="Чистота"></button>
<button class="hotspot prod-up" data-action="upgradeProduction" aria-label="Улучшить производство"></button>
<button class="hotspot energy-up" data-action="upgradeEnergy" aria-label="Улучшить энергию"></button>
<button class="hotspot health-up" data-action="upgradeHealth" aria-label="Улучшить здоровье"></button>
<button class="hotspot invite" data-action="invite" aria-label="Пригласить друга"></button>
<button class="hotspot nav-home" data-screen="home" aria-label="Главная"></button>
<button class="hotspot nav-market" data-screen="market" aria-label="Рынок"></button>
<button class="hotspot nav-coop" data-action="coop" aria-label="Курятник"></button>
<button class="hotspot nav-friends" data-action="friends" aria-label="Друзья"></button>
<button class="hotspot nav-profile" data-action="profile" aria-label="Профиль"></button>
</section>

<div class="toast" id="toast" aria-live="polite"></div>
<div class="sheet" id="sheet" aria-hidden="true">
<button class="backdrop" id="sheetBackdrop" aria-label="Закрыть"></button>
<section class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
<div class="grab"></div>
<div class="sheet-icon" id="sheetIcon">🥚</div>
<h2 id="sheetTitle">COCOCHI</h2>
<p id="sheetText"></p>
<div id="tonConnectMount" class="ton-mount hidden"></div>
<div class="sheet-actions" id="sheetActions"></div>
<button class="sheet-close" id="sheetClose" type="button">Закрыть</button>
</section>
</div>
<div class="burst" id="burst" aria-hidden="true"></div>
</main>
<script type="module" src="/static/v2.js?v=6"></script>
</body>
</html>
